<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect width="100" height="100" rx="22" fill="#14141E" />
  <!-- Center 3-lobe pinwheel: Red, Green, Blue -->
  <g transform="translate(50, 50) scale(0.85)">
    <!-- Red lobe (top) -->
    <path d="M0 -34 C14 -34, 25 -22, 22 -8 C19 5, 0 8, 0 0 Z" fill="#FF453A" />
    <!-- Green lobe (bottom-right) -->
    <path d="M0 -34 C14 -34, 25 -22, 22 -8 C19 5, 0 8, 0 0 Z" fill="#32D74B" transform="rotate(120)" />
    <!-- Blue lobe (bottom-left) -->
    <path d="M0 -34 C14 -34, 25 -22, 22 -8 C19 5, 0 8, 0 0 Z" fill="#0A84FF" transform="rotate(240)" />
    <!-- White center core dot -->
    <circle cx="0" cy="0" r="4.5" fill="#FFFFFF" />
  </g>
</svg>