<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="agGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="#0F172A" />
  <!-- Center sphere -->
  <circle cx="50" cy="50" r="22" fill="url(#agGrad)" />
  <!-- Orbital rings -->
  <ellipse cx="50" cy="50" rx="36" ry="14" fill="none" stroke="url(#ringGrad)" stroke-width="4" transform="rotate(-30 50 50)" />
  <!-- Floating satellite node -->
  <circle cx="74" cy="36" r="4.5" fill="#38BDF8" />
</svg>